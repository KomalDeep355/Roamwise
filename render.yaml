services:
  - type: web
    name: saaf-ghaas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: LLM_PROVIDER
        value: openai_compat
      - key: LLM_BASE_URL
        sync: false   # e.g. https://api.groq.com/openai/v1
      - key: LLM_MODEL
        sync: false   # an open-weight model id from your provider
      - key: LLM_API_KEY
        sync: false
